{% extends "base.html" %}
{% block content %}
<h1 class="h4">Delete "{{ object.title }}"?</h1>
<p class="text-muted">This also deletes its questions. It can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-link" href="{% url 'exams:exam_detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
